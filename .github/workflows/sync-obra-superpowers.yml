name: sync-obra-superpowers
on:
  schedule:
    - cron: '0 3 * * 1'        # 每周一 03:00 UTC 全量镜像上游 skills（推 sync-* 分支开 PR，不直接推 main）
  workflow_dispatch:            # 手动触发兜底（新增/修改 schedule 类 workflow 后必须立即 gh workflow run 冒烟一次）

permissions:
  contents: write               # GITHUB_TOKEN 推固定同步分支
  pull-requests: write          # 创建/更新同步 PR

concurrency:
  group: sync-obra-superpowers
  cancel-in-progress: false     # 同一同步任务排队串行；与直接推 main 的 update-readme / update-actionlint 不共用分组

jobs:
  sync:
    uses: ./.github/workflows/sync-upstream-skills.yml
    with:
      upstream_repo: https://github.com/obra/superpowers.git
      upstream_branch: main
      src_dir: skills
      dst_dir: skills/obra-superpowers
      commit_message: 'chore: 同步上游 obra/superpowers skills 镜像'
      pr_branch: sync/obra-superpowers
