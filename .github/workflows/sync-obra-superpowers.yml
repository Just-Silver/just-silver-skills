name: sync-obra-superpowers
on:
  schedule:
    - cron: '0 3 * * 1'        # 每周一 03:00 UTC 全量镜像上游 skills（与 update-actionlint 同一时刻触发，靠共用 concurrency 排队串行）
  workflow_dispatch:            # 手动触发兜底（新增/修改 schedule 类 workflow 后必须立即 gh workflow run 冒烟一次）

permissions:
  contents: write               # GITHUB_TOKEN 自动提交镜像变更

concurrency:
  group: auto-commit-main
  cancel-in-progress: false     # 与 update-actionlint / update-readme 共用分组：撞车时排队串行，保证回推有序、不冲突

jobs:
  sync:
    uses: ./.github/workflows/sync-upstream-skills.yml
    with:
      upstream_repo: https://github.com/obra/superpowers.git
      upstream_branch: main
      src_dir: skills
      dst_dir: skills/obra-superpowers
      commit_message: 'chore: 同步上游 obra/superpowers skills 镜像'
