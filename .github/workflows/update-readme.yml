name: update-readme
on:
  push:
    branches: [main]
    paths: ['skills/**']        # 仅技能变更时触发（自动提交只改 README，不在该路径内 → 不会递归触发）
  workflow_dispatch:            # 支持手动触发

permissions:
  contents: write               # GITHUB_TOKEN 自动提交 README

concurrency:
  group: auto-commit-main
  cancel-in-progress: false     # 与两个定时任务共用分组：bot 推送触发的本次运行也要排队，保证回推有序、不冲突

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: 生成技能清单表格
        shell: pwsh
        run: ./scripts/update-readme.ps1
      - name: 有变更则自动提交
        shell: pwsh
        run: |
          if (Test-Path README.md) {
            git add README.md
            if (git diff --cached --quiet) {
              Write-Output 'README 无变化，跳过提交'
            } else {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'docs: 自动更新技能清单 README'
              git pull --rebase               # 同组排队只保证不同时跑，不保证 base 最新；推前 rebase 避免 non-fast-forward
              git push
              Write-Output '已自动提交并推送'
            }
          }