name: sync-upstream-skills
# 可复用模板（reusable workflow）：从上游仓库全量镜像 skills 到本地目录，以固定分支 PR 方式提交人工 review。
# 自身 on 只有 workflow_call，不独立运行。
#
# 新增同步需求只需新建 thin caller .github/workflows/sync-<name>.yml：
#   1. schedule 照抄 '0 3 * * 1'（与其它定时任务同一时刻触发；本模板推的是 sync-* 分支、不直接推 main，
#      与 update-readme / update-actionlint 无推 main 冲突，不要另找时间错峰）
#   2. concurrency.group 用独立分组 sync-<name>（cancel-in-progress: false；只防“同一定时任务并行/手动冒烟撞车”，
#      不再共用 auto-commit-main——该分组只给直接推 main 的 update-readme / update-actionlint 用）
#   3. permissions 必须 contents: write + pull-requests: write（推固定分支 + 创建/更新 PR 用）
#   4. jobs 里 uses: ./.github/workflows/sync-upstream-skills.yml 并填 inputs（见文末调用示例）
#   5. dst_dir 必须在 skills/ 顶层（如 skills/<name>）；镜像成功后 update-readme.ps1 靠目录内
#      .mirror 标记自动将其排除出自建技能表，无需改脚本
#   6. pr_branch 固定分支名（默认 sync/<dst 末段>，如 skills/obra-superpowers → sync/obra-superpowers）；
#      显式传入更清晰，定时任务有更新时创建或更新该分支的 PR，无更新静默跳过，review 后手动合并
#   7. 仓库 Settings → Actions → General → Workflow permissions 必须勾选
#      Allow GitHub Actions to create and approve pull requests，否则 gh pr create 报 not permitted
#   8. 上传 workflow 文件一律 git push（REST API 无 Workflows 权限）
#   9. 新增/修改后必须立即 gh workflow run sync-<name>.yml 手动冒烟一次，不得等调度窗口
#
# 约定（拉取失败必须抛错，只有无更新才静默）：
#   - 上游仓库被删/改名、无分支、无源目录 → throw，job 变红，不动本地、不开 PR
#   - 完全镜像：先删本地目录再拷，上游删了本地跟着删；.mirror 标记内容固定（无时间戳），避免无意义 diff
#   - PR 合并到 main 后会触发 update-readme（paths: skills/**），但镜像目录被 .mirror 排除、不计入技能表 →
#     README 无变化则静默，递归终止

# 调用示例（sync-<name>.yml 全文）：
#   name: sync-foo
#   on:
#     schedule:
#       - cron: '0 3 * * 1'
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   concurrency:
#     group: sync-foo
#     cancel-in-progress: false
#   jobs:
#     sync:
#       uses: ./.github/workflows/sync-upstream-skills.yml
#       with:
#         upstream_repo: https://github.com/foo/bar.git
#         upstream_branch: main
#         src_dir: skills
#         dst_dir: skills/foo-bar
#         commit_message: 'chore: 同步上游 foo/bar skills 镜像'
#         pr_branch: sync/foo-bar

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: '上游仓库地址（如 https://github.com/obra/superpowers.git）'
        required: true
        type: string
      upstream_branch:
        description: '上游分支'
        default: 'main'
        required: false
        type: string
      src_dir:
        description: '上游仓库内的源目录'
        default: 'skills'
        required: false
        type: string
      dst_dir:
        description: '本地目标目录，skills 顶层（如 skills/obra-superpowers）'
        required: true
        type: string
      commit_message:
        description: '有变更时的提交信息（同时作为 PR 标题）'
        required: true
        type: string
      pr_branch:
        description: '固定 PR 分支名（默认 sync/<dst 末段>，如 skills/obra-superpowers → sync/obra-superpowers）'
        default: ''
        required: false
        type: string

permissions:
  contents: write               # 推固定分支用
  pull-requests: write          # 创建/更新 PR 用

concurrency:
  group: sync-${{ inputs.dst_dir }}
  cancel-in-progress: false     # 同一同步任务排队串行；不同 dst_dir 分支不同，互不干扰

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: 全量镜像上游 skills
        shell: pwsh
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          SRC_DIR: ${{ inputs.src_dir }}
          DST_DIR: ${{ inputs.dst_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DST_DIR -notmatch '^skills/[^/]+$') { throw "目标目录必须在 skills 顶层（如 skills/<name>）: $env:DST_DIR" }
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ('upstream-skills-' + [guid]::NewGuid().ToString('N'))
          try {
            git clone --depth 1 --branch $env:UPSTREAM_BRANCH $env:UPSTREAM_REPO $tmp
            if ($LASTEXITCODE -ne 0) { throw "上游仓库拉取失败: $env:UPSTREAM_REPO（分支 $env:UPSTREAM_BRANCH，可能被删/改名或无该分支）" }
            $src = Join-Path $tmp $env:SRC_DIR
            if (-not (Test-Path $src)) { throw "上游仓库缺少源目录 $env:SRC_DIR，终止同步" }
            $dst = Join-Path $PWD $env:DST_DIR
            if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }  # 完全镜像：上游删了本地跟着删
            New-Item -ItemType Directory -Path $dst | Out-Null
            Copy-Item (Join-Path $src '*') $dst -Recurse -Force
            # 标记镜像目录：update-readme.ps1 靠此标记自动排除（内容固定，无时间戳，避免无意义 diff）
            Set-Content -Path (Join-Path $dst '.mirror') -Value "upstream=$env:UPSTREAM_REPO branch=$env:UPSTREAM_BRANCH src=$env:SRC_DIR" -NoNewline
            Write-Output '镜像完成'
          } finally {
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: 有变更则提交到固定分支 PR
        shell: pwsh
        env:
          DST_DIR: ${{ inputs.dst_dir }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          SRC_DIR: ${{ inputs.src_dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # 固定分支名：未显式传入时按 dst 末段推导（skills/obra-superpowers → sync/obra-superpowers）
          $branch = $env:PR_BRANCH
          if ([string]::IsNullOrWhiteSpace($branch)) {
            $leaf = Split-Path $env:DST_DIR -Leaf
            $branch = "sync/$leaf"
          }
          git add $env:DST_DIR
          # 注意：git diff --quiet 靠 exit code 判空（有差异 exit 1，无差异 exit 0），
          # 不能写成 if (git diff --cached --quiet)——PowerShell 取的是命令 stdout（为空恒为假），
          # 且 exit 1 在 $ErrorActionPreference='Stop' 下可能直接抛错；改用 --name-only 输出判空。
          $staged = git diff --cached --name-only
          if ([string]::IsNullOrWhiteSpace($staged)) {
            Write-Output '上游无更新，跳过 PR'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $branch         # 暂存区变更随分支携带：新分支 = 最新 main + 本次镜像变更
          git commit -m $env:COMMIT_MESSAGE
          git push -f origin "HEAD:$branch"   # -f：同名分支已有旧同步提交时直接覆盖，保证 PR 永远是“最新 main + 最新上游”
          # 同名 PR 已存在则只推分支（PR 自动更新），不存在才新建
          # 注意：gh pr list 无匹配时返回 []，'.[0].url' 会输出字面量 null，必须加 '// empty' 转为空输出，
          # 否则 $existing 拿到 "null" 字符串误判为 PR 已存在，导致该建 PR 时没建
          $existing = gh pr list --head $branch --base main --json url --jq '.[0].url // empty' 2>$null
          if ([string]::IsNullOrWhiteSpace($existing)) {
            $body = "上游仓库: $env:UPSTREAM_REPO`n上游分支: $env:UPSTREAM_BRANCH`n源目录: $env:SRC_DIR`n目标目录: $env:DST_DIR`n`n由 sync workflow 自动生成，review 后手动合并。"
            gh pr create --base main --head $branch --title $env:COMMIT_MESSAGE --body $body
            if ($LASTEXITCODE -ne 0) { throw "PR 创建失败（若提示 not permitted to create pull requests，请去仓库 Settings → Actions → General 勾选 Allow GitHub Actions to create and approve pull requests）" }
            Write-Output '已创建 PR'
          } else {
            Write-Output "已更新已有 PR: $existing"
          }
